<svg
        width="320"
        height="320"
        viewBox="0 0 320 320"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
>
    <defs>
        <linearGradient id="crimsonBrush" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a0c18" />
            <stop offset="50%" stop-color="#7a132a" />
            <stop offset="100%" stop-color="#b1123f" />
        </linearGradient>

        <radialGradient id="brushGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b1123f" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#b1123f" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="bristleGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3c7d1" />
            <stop offset="100%" stop-color="#b1123f" />
        </linearGradient>
    </defs>

    <!-- subtle glow -->
    <circle cx="160" cy="160" r="140" fill="url(#brushGlow)" />

    <!-- outer circle -->
    <circle
            cx="160"
            cy="160"
            r="112"
            stroke="url(#crimsonBrush)"
            stroke-width="5"
    />

    <!-- four side lines -->
    <g stroke="#7a132a" stroke-width="2" stroke-linecap="round">
        <line x1="160" y1="75" x2="160" y2="112" />
        <line x1="245" y1="160" x2="208" y2="160" />
        <line x1="160" y1="245" x2="160" y2="208" />
        <line x1="75" y1="160" x2="112" y2="160" />
    </g>

    <!-- dots -->
    <g fill="#b1123f">
        <circle cx="160" cy="75" r="5" />
        <circle cx="245" cy="160" r="5" />
        <circle cx="160" cy="245" r="5" />
        <circle cx="75" cy="160" r="5" />
    </g>

    <!-- slim & long brush (-45° left, full size) -->
    <g transform="rotate(-45 160 160)">
        <!-- handle (slimmer + longer) -->
        <path
                d="M148 152
         C146 154 146 212 148 216
         L172 216
         C174 212 174 154 172 152
         Z"
                fill="#7a132a"
        />

        <!-- ferrule (slim) -->
        <rect
                x="146"
                y="134"
                width="28"
                height="18"
                rx="4"
                fill="#b1123f"
        />

        <!-- bristles (longer, narrow) -->
        <path
                d="M146 134
         C132 120 122 108 118 96
         C114 84 128 78 142 84
         C154 90 166 90 178 84
         C192 78 206 84 202 96
         C198 108 188 120 174 134
         Z"
                fill="url(#bristleGrad)"
        />

        <!-- subtle bristle strands -->
        <g stroke="#7a132a" stroke-width="0.8" opacity="0.55">
            <line x1="140" y1="124" x2="126" y2="104" />
            <line x1="152" y1="126" x2="140" y2="106" />
            <line x1="160" y1="126" x2="160" y2="104" />
            <line x1="168" y1="126" x2="180" y2="106" />
            <line x1="180" y1="124" x2="194" y2="104" />
        </g>
    </g>
</svg>
