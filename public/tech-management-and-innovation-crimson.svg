<svg
        width="320"
        height="320"
        viewBox="0 0 320 320"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
>
    <defs>
        <linearGradient id="crimsonTMI2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a0c18" />
            <stop offset="50%" stop-color="#7a132a" />
            <stop offset="100%" stop-color="#b1123f" />
        </linearGradient>

        <radialGradient id="tmiGlow2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b1123f" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#b1123f" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="softPink" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f3c7d1" stop-opacity="0.95" />
            <stop offset="100%" stop-color="#f3c7d1" stop-opacity="0.75" />
        </linearGradient>
    </defs>

    <!-- Glow -->
    <circle cx="160" cy="160" r="140" fill="url(#tmiGlow2)" />

    <!-- Outer ring -->
    <circle
            cx="160"
            cy="160"
            r="112"
            stroke="url(#crimsonTMI2)"
            stroke-width="5"
    />

    <!-- Management "stats" ring segment -->
    <path
            d="M160 48
       A112 112 0 0 1 270 142"
            stroke="#7a132a"
            stroke-width="6"
            stroke-linecap="round"
            opacity="0.85"
    />

    <!-- Inner core disk -->


    <!-- Central icon: server stack + tiny robot head (tech + innovation) -->
    <g transform="translate(160 160)">
        <!-- server stack -->
        <rect x="-34" y="-10" width="68" height="20" rx="6" fill="#7a132a" opacity="0.95" />
        <rect x="-34" y="14" width="68" height="20" rx="6" fill="#7a132a" opacity="0.9" />
        <rect x="-34" y="-34" width="68" height="20" rx="6" fill="#7a132a" />

        <!-- server lights -->
        <g fill="url(#softPink)">
            <circle cx="-22" cy="-24" r="3.2" />
            <circle cx="-10" cy="-24" r="3.2" opacity="0.85" />
            <circle cx="-22" cy="-0" r="3.2" />
            <circle cx="-10" cy="-0" r="3.2" opacity="0.85" />
            <circle cx="-22" cy="24" r="3.2" />
            <circle cx="-10" cy="24" r="3.2" opacity="0.85" />
        </g>

        <!-- robot head above servers -->

    </g>

    <!-- Management: bar chart + growth arrow (inside ring, lower-left) -->



    <!-- Gear-like modular blocks around core (tech ops / systems) -->


    <!-- Structural nodes -->
    <g fill="#b1123f">
        <circle cx="160" cy="70" r="5" />
        <circle cx="250" cy="160" r="5" />
        <circle cx="160" cy="250" r="5" />
        <circle cx="70" cy="160" r="5" />
    </g>

    <!-- Structural lines -->
    <g stroke="#7a132a" stroke-width="2" opacity="0.95">
        <line x1="160" y1="75" x2="160" y2="112" />
        <line x1="245" y1="160" x2="212" y2="160" />
        <line x1="160" y1="245" x2="160" y2="208" />
        <line x1="75" y1="160" x2="112" y2="160" />
    </g>

    <!-- Outer micro-dots -->
</svg>
